name: Build & Publish Docker Images

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version (e.g., v1.2.3)'
        required: false
        type: string
      push:
        description: 'Push images to registry'
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.2.3)'
        required: false
        type: string
      push:
        description: 'Push images to registry'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
  REGISTRY: docker.io
  IMAGE_BASE: chronophage/fates-edge
  # Also push to GitHub Container Registry so images show up as
  # Packages on the repo itself, with zero extra secrets (GITHUB_TOKEN
  # already has packages: write above). GHCR requires an all-lowercase
  # image path, so the owner is lowercased at runtime below rather than
  # here (env context has no string functions).
  GHCR_REGISTRY: ghcr.io

jobs:
  docker-build:
    name: Build & Push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - name: socket-server
            context: ./utilities/javascript/fates-edge-socket-server
            dockerfile: ./utilities/javascript/fates-edge-socket-server/Dockerfile
          - name: web-client
            context: ./utilities/javascript/fates-edge-web-client
            dockerfile: ./utilities/javascript/fates-edge-web-client/Dockerfile
          # NEW: previously had a working Dockerfile but was never
          # actually built/pushed anywhere -- only packaged as a plain
          # tarball in build-and-release.yml. Added to this matrix so it
          # gets a real, pullable image like its two siblings.
          - name: discord-bot
            context: ./utilities/vtt_mods_bots/fates-edge-discord-bot
            dockerfile: ./utilities/vtt_mods_bots/fates-edge-discord-bot/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Log in to GHCR too, using the built-in token (no secrets to manage).
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="latest"
          fi
          SHA="${{ github.sha }}"
          APP="${{ matrix.app.name }}"

          # FIX: this used to also push a bare "${IMAGE_BASE}:${VERSION}"
          # tag (no app suffix) from every matrix job. Since all three
          # apps share one Docker Hub repo (chronophage/fates-edge), that
          # bare tag collided across socket-server/web-client/discord-bot
          # -- whichever matrix job finished last silently overwrote it,
          # so "chronophage/fates-edge:v4.15.0" ended up pointing at only
          # one of the three images with no error or warning. Every tag
          # pushed now is prefixed with the app name, so each app's tags
          # are unique within the shared repo.
          TAGS="${IMAGE_BASE}:${APP}-${VERSION},${IMAGE_BASE}:${APP}-${SHA}"
          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAGS="${TAGS},${IMAGE_BASE}:${APP}-latest"
          fi

          # Mirror the same tag set to ghcr.io. GHCR image paths must be
          # all-lowercase, so the repository owner is lowercased here.
          GHCR_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          GHCR_BASE="${GHCR_REGISTRY}/${GHCR_OWNER}/fates-edge"
          GHCR_TAGS="${GHCR_BASE}:${APP}-${VERSION},${GHCR_BASE}:${APP}-${SHA}"
          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            GHCR_TAGS="${GHCR_TAGS},${GHCR_BASE}:${APP}-latest"
          fi
          TAGS="${TAGS},${GHCR_TAGS}"

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app.context }}
          file: ${{ matrix.app.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push == true || inputs.push == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.app.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app.name }}
          provenance: false
