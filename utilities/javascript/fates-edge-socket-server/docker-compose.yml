version: '3.8'

# ---------------------------------------------------------------
# Fate's Edge — Realtime server + TURN (voice chat NAT traversal)
#
# Scope note: this compose file covers the socket-server and its
# coturn TURN relay only. It's deliberately NOT the "one
# docker-compose up for the whole ecosystem" file from the roadmap
# (client + server + optional bots) — that's a separate, larger
# unification effort. This one exists because the server and coturn
# share a secret (TURN_SECRET / static-auth-secret) and are the two
# pieces the voice-chat NAT-traversal fix actually depends on. It will
# get folded into the unified compose file once that lands.
#
# Quick start:
#   1. cp .env.example .env
#   2. Fill in TURN_SECRET (any long random string) and TURN_URLS
#      (turn:<a DNS name or public IP your players can reach>:3478) --
#      plus TURN_PUBLIC_IP below if this host's public IP differs from
#      the one Docker sees locally (common on cloud VMs).
#   3. docker-compose up
#
# Voice chat works with ZERO TURN configuration too (STUN-only, via
# public Google STUN servers) — it just won't traverse symmetric
# NAT / restrictive firewalls. Leaving TURN_SECRET blank disables the
# turn-credentials endpoint gracefully (404) and the coturn container
# still starts, it's simply unused.
# ---------------------------------------------------------------

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: fates-edge-server:latest
    container_name: fates-edge-server
    ports:
      - "${PORT:-10000}:${PORT:-10000}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-10000}
      # Optional -- if unset, the server generates and logs a random one
      # at startup (see `docker-compose logs server`); set it explicitly
      # so it survives container restarts.
      - API_KEY=${API_KEY:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # FIX: campaign data (server/storage.js) is a SQLite database, NOT
      # per-campaign JSON files -- it defaults to ./campaigns.db, which
      # resolves to /app/campaigns.db inside the container. Nothing was
      # mounting that path, so every `docker compose down` (or even just
      # recreating the container) silently deleted every saved campaign,
      # room password, and account. Pointed it at a file inside the
      # already-host-mounted ./data volume below instead, so it survives
      # container recreation like everything else here does.
      - DATABASE_URL=/app/data/campaigns.db
      # TURN credential minting -- must match the coturn service below.
      - TURN_SECRET=${TURN_SECRET:-}
      - TURN_REALM=${TURN_REALM:-fates-edge}
      # Must list URLs that actually match what coturn below is listening
      # on -- set this explicitly in .env, e.g.:
      #   TURN_URLS=turn:your-host-or-ip:3478
      # and, only once TURN_ENABLE_TLS=true and a real cert is mounted:
      #   TURN_URLS=turn:your-host-or-ip:3478,turns:your-host-or-ip:5349
      - TURN_URLS=${TURN_URLS:-}
      - TURN_CREDENTIAL_TTL=${TURN_CREDENTIAL_TTL:-86400}
    volumes:
      - ./data:/app/data
      - server-logs:/app/logs
      - server-modules:/app/modules
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:${PORT:-10000}/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - fates-edge-network

  coturn:
    image: coturn/coturn:4.6
    container_name: fates-edge-turn
    restart: unless-stopped
    # coturn allocates its UDP relay ports dynamically per session, which
    # doesn't play nicely with Docker's bridge/NAT networking -- host
    # networking is the standard way to run coturn in a container. This
    # only works on Linux Docker hosts; Docker Desktop (Mac/Windows)
    # doesn't support host networking, so on those platforms you'll need
    # to run coturn directly on the host (or a Linux VM) instead of via
    # this compose service. 40 relay ports is plenty for a small
    # self-hosted table of players -- raise --min-port/--max-port above
    # if you're running many simultaneous rooms.
    network_mode: "host"
    environment:
      - TURN_REALM=${TURN_REALM:-fates-edge}
      - TURN_SECRET=${TURN_SECRET:?Set TURN_SECRET in .env}
      - TURN_PUBLIC_IP=${TURN_PUBLIC_IP:-}
      # Set to "true" once you've mounted a real cert/key below (see
      # volumes) to also listen for turns:// (TLS on 5349) -- that's
      # what lets voice chat get through firewalls that block everything
      # except HTTPS-looking traffic. Defaults to plain turn:// only
      # (UDP/TCP on 3478), which is enough for most home NATs.
      - TURN_ENABLE_TLS=${TURN_ENABLE_TLS:-false}
    volumes:
      - ./coturn/cert.pem:/etc/coturn/cert.pem:ro
      - ./coturn/key.pem:/etc/coturn/key.pem:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ARGS="--listening-port=3478 --min-port=49160 --max-port=49200 \
          --realm=$$TURN_REALM --use-auth-secret --static-auth-secret=$$TURN_SECRET \
          --no-cli --log-file=stdout --fingerprint"
        if [ -n "$$TURN_PUBLIC_IP" ]; then
          ARGS="$$ARGS --external-ip=$$TURN_PUBLIC_IP"
        fi
        if [ "$$TURN_ENABLE_TLS" = "true" ]; then
          ARGS="$$ARGS --tls-listening-port=5349 --cert=/etc/coturn/cert.pem --pkey=/etc/coturn/key.pem --no-tlsv1 --no-tlsv1_1"
        fi
        exec turnserver $$ARGS

networks:
  fates-edge-network:
    driver: bridge

volumes:
  server-logs:
  server-modules:
