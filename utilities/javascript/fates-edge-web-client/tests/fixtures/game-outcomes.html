<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game outcome regression fixture</title>
<link rel="stylesheet" href="../../js/features/kon-reh/workspace.css"></head><body style="background:#14151c;color:#eee;font-family:system-ui">
<main id="app-content"><section><h1>Game outcome regression fixture</h1><p>Test-only page. Uses the real game controllers and result screens.</p>
<button id="kr-win">Kon’reh victory</button><button id="kr-lose">Kon’reh defeat</button><button id="kr-draw">Kon’reh draw</button>
<button id="tv-win">Toll &amp; Veil victory</button><button id="tv-lose">Toll &amp; Veil defeat</button><button id="tv-shared">Shared table result</button>
</section></main><script type="module">
import {KonrehEngine,openKonrehModal} from '../../js/features/kon-reh/index.js';
import {createLocalController,openTollVeilModal} from '../../js/features/kon-reh/toll-and-veil.js';
import {aiChooseBid,aiChoosePlay} from '../../js/features/kon-reh/toll-and-veil-engine.js';
function konreh(result) {
 const e=new KonrehEngine();
 const loser=result==='lose'?1:2;
 e.pieces.filter(p=>p.player===loser).forEach(p=>{p.isAlive=false;e.board[p.y][p.x]=null;});
 e.turn=loser;e.startTurn();
 if(result==='draw'){e.winner='draw';e.winReason='Neither side has a legal move.';}
 openKonrehModal({localPlayer:1,initialState:{...e,doubleMoveUsed:[...e.doubleMoveUsed]}});
}
function toll(result) {
 const c=createLocalController({numSeats:3,aiSeats:result==='shared'?[]:[1,2],winningScore:1,stakeConfig:{mode:'string',storyRisk:'rumor'}});
 const e=c._engine;
 for(let i=0;i<500&&e.phase!=='game_over';i++){const s=e.currentSeat;if(e.phase==='bidding')e.makeBid(s,aiChooseBid(e,s));else{const p=aiChoosePlay(e,s);e.playCard(s,p.id,p);}}
 if(e.phase!=='game_over')throw new Error('Fixture did not complete');
 if(result!=='shared')Object.defineProperty(c,'localSeat',{value:result==='win'?e.gameWinner:(e.gameWinner+1)%3});
 c.humanSeats=[0,1,2];
 c.seatNames=['Ada','Bea','Cora'];
 openTollVeilModal({controller:c});
}
for(const type of ['win','lose','draw'])document.getElementById('kr-'+type).onclick=()=>konreh(type);
for(const type of ['win','lose','shared'])document.getElementById('tv-'+type).onclick=()=>toll(type);
</script></body></html>
