services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fates_edge_manager
      POSTGRES_USER: manager
      POSTGRES_PASSWORD: ${MANAGER_DB_PASSWORD:?Run npm run setup first}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - manager-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manager -d fates_edge_manager"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  manager-database:
