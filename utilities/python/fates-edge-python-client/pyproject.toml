[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fates-edge-client"
version = "5.2.0"
description = "Python client for the Fate's Edge socket server (characters, timers, dice, Deck of Consequences, campaign sync)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Fate's Edge"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Matches what the code actually imports (see ws_client.py, rest_client.py,
# io_utils.py) -- the old pyproject.toml/setup.py declared websocket-client
# (never imported) and python-socketio without its asyncio extra (the async
# client needs aiohttp), and left pyyaml undeclared entirely despite
# io_utils.py using it for character export/import.
dependencies = [
    "requests>=2.28.0",
    "python-socketio[asyncio-client]>=5.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=22.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
fates-edge = "fates_edge_client.__main__:main"

[tool.setuptools.packages.find]
include = ["fates_edge_client*"]

# As of v5.1.0, region flavor-text data (data/regions/*.json) is
# deliberately NOT declared as package-data and so is NOT bundled into the
# built wheel/sdist. That data is Fate's Edge Copyright content (personal,
# non-commercial use only -- see LICENSE.proprietary), not MIT like this
# package's own metadata/classifiers above -- bundling it made every
# install claim to be 100% MIT when it wasn't. It's fetched separately and
# opt-in instead: see data_fetch.py / `fates-edge data --fetch`. The files
# remain in this source tree (see MANIFEST.in) purely so a source checkout
# / editable install (e.g. running this package's own test suite) has
# real data to exercise deck.py's region-data loader against.

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
