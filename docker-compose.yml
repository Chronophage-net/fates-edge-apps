version: '3.8'

# =================================================================
# Fate's Edge Toolkit — full ecosystem in one `docker-compose up`
#
# Default (no flags): brings up the web client + real-time server.
# That's the whole "getting started" experience -- zero required
# config, an API key is auto-generated by the server if you don't set
# one (see server/config.js).
#
# Everything else is opt-in via Compose profiles, since bots need
# secrets (Discord token, an AI provider API key) that a first-time
# user won't have, and coturn needs a shared secret too -- none of
# that should block `docker-compose up` from working out of the box.
#
#   docker-compose up                                   # client + server only
#   docker-compose --profile turn up                     # + TURN relay for voice chat NAT traversal
#   docker-compose --profile bots up                     # + AI GM bot + Discord bot
#   docker-compose --profile ai-gm-bot up                 # + just the AI GM bot
#   docker-compose --profile discord-bot up               # + just the Discord bot
#   docker-compose --profile turn --profile bots up       # + everything
#
# Or set COMPOSE_PROFILES=turn,bots in .env to make one of the above
# the default for every `docker-compose up` you run locally.
#
# Setup:
#   1. cp .env.example .env
#   2. Fill in whichever sections you actually need (server-only
#      config works with zero edits; bots/TURN need their own secrets
#      -- see the comments in .env.example).
#   3. docker-compose up [--profile ...]
#
# The AI GM bot (fates-edge-ai-gm-bot) lives in a SEPARATE git repo,
# not inside fates-edge-apps. Clone it as a sibling directory:
#   Chronophage-net_GitHub/
#   ├── fates-edge-apps/          <- this repo (docker-compose.yml is here)
#   └── fates-edge-ai-gm-bot/     <- sibling clone
# If you haven't cloned it, just don't enable the ai-gm-bot/bots
# profile -- every other service works fine without it.
# =================================================================

services:
  # ─── Web Client ───────────────────────────────────────────────
  client:
    build:
      context: ./utilities/javascript/fates-edge-web-client
      dockerfile: Dockerfile
    image: fates-edge-client:latest
    container_name: fates-edge-client
    ports:
      - "${CLIENT_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fates-edge-network

  # ─── Real-Time / Campaign Sharing Server ─────────────────────
  server:
    build:
      context: ./utilities/javascript/fates-edge-socket-server
      dockerfile: Dockerfile
    image: fates-edge-server:latest
    container_name: fates-edge-server
    ports:
      - "${SERVER_PORT:-10000}:${SERVER_PORT:-10000}"
    environment:
      - NODE_ENV=production
      - PORT=${SERVER_PORT:-10000}
      # Optional -- if unset, the server generates and logs a random
      # one at startup (see `docker-compose logs server`). Set it
      # explicitly so it survives container restarts and bots can be
      # configured with it ahead of time.
      - API_KEY=${API_KEY:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # TURN credential minting -- only relevant if you also enable
      # the `turn` profile below. Safe to leave blank otherwise.
      - TURN_SECRET=${TURN_SECRET:-}
      - TURN_REALM=${TURN_REALM:-fates-edge}
      - TURN_URLS=${TURN_URLS:-}
      - TURN_CREDENTIAL_TTL=${TURN_CREDENTIAL_TTL:-86400}
    volumes:
      - ./utilities/javascript/fates-edge-socket-server/data:/app/data
      - server-logs:/app/logs
      - server-modules:/app/modules
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:${SERVER_PORT:-10000}/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - fates-edge-network

  # ─── TURN relay (optional: `--profile turn`) ─────────────────
  # See utilities/javascript/fates-edge-socket-server/docker-compose.yml
  # for the standalone server+TURN-only variant this was lifted from,
  # and its coturn/README.md for TLS setup.
  coturn:
    profiles: ["turn"]
    image: coturn/coturn:4.6
    container_name: fates-edge-turn
    restart: unless-stopped
    # Host networking only works on Linux Docker hosts (not Docker
    # Desktop for Mac/Windows) -- see the note in the standalone
    # server compose file linked above.
    network_mode: "host"
    environment:
      - TURN_REALM=${TURN_REALM:-fates-edge}
      # NOTE: deliberately `:-` (not `:?`) here -- Compose interpolates
      # env vars for every service in the file up front, before
      # filtering by profile, so a `:?required` on a profiled-off
      # service would break plain `docker-compose up` even though this
      # container never runs in that case. The empty-string check
      # happens at container startup instead (see command below).
      - TURN_SECRET=${TURN_SECRET:-}
      - TURN_PUBLIC_IP=${TURN_PUBLIC_IP:-}
      - TURN_ENABLE_TLS=${TURN_ENABLE_TLS:-false}
    volumes:
      - ./utilities/javascript/fates-edge-socket-server/coturn/cert.pem:/etc/coturn/cert.pem:ro
      - ./utilities/javascript/fates-edge-socket-server/coturn/key.pem:/etc/coturn/key.pem:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -z "$$TURN_SECRET" ]; then
          echo "ERROR: TURN_SECRET is not set. Set it in .env before using the 'turn' profile." >&2
          exit 1
        fi
        ARGS="--listening-port=3478 --min-port=49160 --max-port=49200 \
          --realm=$$TURN_REALM --use-auth-secret --static-auth-secret=$$TURN_SECRET \
          --no-cli --log-file=stdout --fingerprint"
        if [ -n "$$TURN_PUBLIC_IP" ]; then
          ARGS="$$ARGS --external-ip=$$TURN_PUBLIC_IP"
        fi
        if [ "$$TURN_ENABLE_TLS" = "true" ]; then
          ARGS="$$ARGS --tls-listening-port=5349 --cert=/etc/coturn/cert.pem --pkey=/etc/coturn/key.pem --no-tlsv1 --no-tlsv1_1"
        fi
        exec turnserver $$ARGS

  # ─── AI GM Bot (optional: `--profile bots` or `--profile ai-gm-bot`) ───
  # Lives in the separate fates-edge-ai-gm-bot repo -- see the note at
  # the top of this file. Requires an AI provider key (OpenAI/DeepSeek/
  # Ollama) -- see .env.example.
  ai-gm-bot:
    profiles: ["bots", "ai-gm-bot"]
    build:
      context: ../fates-edge-ai-gm-bot
      dockerfile: Dockerfile
    image: fates-edge-ai-gm-bot:latest
    container_name: fates-edge-ai-gm-bot
    depends_on:
      - server
    environment:
      - NODE_ENV=production
      - WS_URL=ws://server:${SERVER_PORT:-10000}
      - API_KEY=${API_KEY:-}
      - ROOM=${AIGM_ROOM:-AIGM}
      - BOT_NAME=${AIGM_BOT_NAME:-AIGM}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
    restart: unless-stopped
    networks:
      - fates-edge-network

  # ─── Discord Bot (optional: `--profile bots` or `--profile discord-bot`) ───
  discord-bot:
    profiles: ["bots", "discord-bot"]
    build:
      context: ./utilities/vtt_mods_bots/fates-edge-discord-bot
      dockerfile: Dockerfile
    image: fates-edge-discord-bot:latest
    container_name: fates-edge-discord-bot
    depends_on:
      - server
    environment:
      - NODE_ENV=production
      # NOTE: `:-` not `:?` -- see the TURN_SECRET comment above for why.
      # discord.js itself raises a clear "invalid token" error at
      # startup if this is left blank while the profile is enabled.
      - DISCORD_TOKEN=${DISCORD_TOKEN:-}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID:-}
      - VTT_SERVER_URL=ws://server:${SERVER_PORT:-10000}
      - VTT_API_KEY=${API_KEY:-}
      - VTT_ROOM_CODE=${DISCORD_ROOM_CODE:-AC12}
      - PREFIX=${DISCORD_PREFIX:-!}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    restart: unless-stopped
    networks:
      - fates-edge-network

networks:
  fates-edge-network:
    driver: bridge

volumes:
  server-logs:
  server-modules:
